<svg width="900" height="260" viewBox="0 0 900 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="900" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#030705"/>
      <stop offset="50%" stop-color="#07150F"/>
      <stop offset="100%" stop-color="#040806"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <radialGradient id="doomGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hexGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#10B981" stroke-width="0.5" stroke-opacity="0.12"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }
    @keyframes scanline {
      0% { transform: translateY(-20px); }
      100% { transform: translateY(260px); }
    }
    .glow-orb { animation: pulseGlow 4s infinite ease-in-out; }
    .scan { animation: scanline 6s linear infinite; }
  </style>

  <rect width="900" height="260" rx="16" fill="url(#bgGrad)" stroke="#10B981" stroke-opacity="0.35" stroke-width="1.5"/>
  <rect width="900" height="260" rx="16" fill="url(#hexGrid)"/>
  <ellipse cx="450" cy="130" rx="340" ry="110" fill="url(#doomGlow)" class="glow-orb"/>
  <rect x="0" y="0" width="900" height="2" fill="#34D399" opacity="0.15" class="scan"/>

  <path d="M 24 44 L 24 24 L 44 24" stroke="#10B981" stroke-width="2.5"/>
  <path d="M 876 44 L 876 24 L 856 24" stroke="#10B981" stroke-width="2.5"/>
  <path d="M 24 216 L 24 236 L 44 236" stroke="#10B981" stroke-width="2.5"/>
  <path d="M 876 216 L 876 236 L 856 236" stroke="#10B981" stroke-width="2.5"/>

  <polygon points="105,95 130,110 130,145 105,160 80,145 80,110" fill="none" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.5"/>
  <polygon points="795,95 820,110 820,145 795,160 770,145 770,110" fill="none" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.5"/>

  <rect x="335" y="42" width="230" height="24" rx="12" fill="#062016" stroke="#10B981" stroke-opacity="0.5"/>
  <text x="450" y="58" fill="#34D399" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="2" text-anchor="middle">PROTOCOL // DOOMSDAY-616</text>

  <text x="450" y="128" fill="url(#metalGrad)" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="4" text-anchor="middle">NAMA KAMU</text>
  <text x="450" y="164" fill="#10B981" font-family="monospace" font-size="15" font-weight="bold" letter-spacing="2.5" text-anchor="middle">ARCHITECT OF SYSTEMS • MULTIVERSE DEVELOPER</text>
  <text x="450" y="206" fill="#64748B" font-family="monospace" font-size="12" letter-spacing="1.5" text-anchor="middle">"ALL HOPE LIES IN CLEAN CODE &amp; SCALABLE ARCHITECTURE."</text>
</svg>
